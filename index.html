<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mamer Smart Display — Style chaleureux V16</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#28313c}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background-color:#28313c;background-position:center center;background-size:cover;background-repeat:no-repeat}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:-webkit-linear-gradient(top,rgba(22,13,22,.30),rgba(28,17,18,.03) 46%,rgba(22,11,14,.52));background:linear-gradient(to bottom,rgba(22,13,22,.30),rgba(28,17,18,.03) 46%,rgba(22,11,14,.52))}
#nightShade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:transparent}
.app{position:relative;z-index:2;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;min-height:100vh;padding:31px 5% 22px;text-shadow:0 2px 10px rgba(0,0,0,.38)}
.tabs{text-align:center;white-space:nowrap;margin:0 auto 40px}
.tabs button{font-family:Arial,Helvetica,sans-serif;color:#fff;background:rgba(45,33,49,.47);border:1px solid rgba(255,255,255,.42);border-radius:30px;font-size:17px;padding:11px 22px;margin:0 4px;cursor:pointer;text-shadow:0 1px 5px rgba(0,0,0,.2)}
.tabs button.active{background:rgba(204,161,121,.70);border-color:rgba(255,237,207,.89);box-shadow:0 0 14px rgba(255,227,182,.25)}
.tabs button:focus{outline:2px solid rgba(255,237,207,.8)}
.top{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;min-width:0}
.clock{font-family:Georgia,'Times New Roman',serif;font-size:128px;font-size:12.4vw;font-weight:normal;line-height:.95;letter-spacing:-5px;white-space:nowrap}
.date{font-family:Georgia,'Times New Roman',serif;font-size:32px;font-size:3vw;line-height:1.2;margin:11px 0 0}
.current{text-align:right;padding-left:10px;min-width:0}
.weather-icon{font-size:72px;line-height:1.1;text-align:right;min-height:65px}
.temp{font-family:Georgia,'Times New Roman',serif;font-size:96px;font-size:9vw;line-height:1.02;white-space:nowrap}
#condition{font-size:20px;font-weight:normal;white-space:nowrap}
#cityname{font-size:14px;margin-top:7px;opacity:.85}
.bottom{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;margin-top:25px}
.panel{border-radius:25px;background:rgba(84,59,45,.68);border:1px solid rgba(247,221,188,.45);padding:19px 24px 18px;box-shadow:0 7px 24px rgba(0,0,0,.20);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.forecast{-webkit-flex:1.18;flex:1.18;margin-right:15px}
.details{-webkit-flex:1;flex:1}
.heading{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:normal;padding-bottom:15px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.35)}
.heading .heading-icon{display:inline-block;margin-right:11px;color:#ffd08c;font-size:25px;vertical-align:middle}
.days{display:-webkit-flex;display:flex;text-align:center}
.day{-webkit-flex:1;flex:1;font-size:18px;line-height:1.5;border-right:1px solid rgba(255,255,255,.28);min-width:0}
.day:last-child{border-right:0}
.symbol{font-size:27px;margin:8px 0}
.day .low{opacity:.85;font-size:16px}
.sun-grid{display:-webkit-flex;display:flex;text-align:center}
.sun-item{-webkit-flex:1;flex:1;border-right:1px solid rgba(255,255,255,.28);min-width:0;padding:1px 4px}
.sun-item:last-child{border:0}
.sun-icon{font-size:29px;color:#ffc678;line-height:1.3}
.sun-name{font-size:17px;margin:2px 0 5px}
.sun-value{font-family:Georgia,'Times New Roman',serif;font-size:31px}
#status{font-size:10px;opacity:.73;margin-top:11px;text-align:right}
.credit{text-align:right;margin-top:8px;font-size:10px;opacity:.82}.credit a{color:#fff}
@media(max-width:850px){.app{padding:15px 4% 12px}.tabs{margin-bottom:24px}.tabs button{font-size:13px;padding:7px 12px;margin:0 2px}.clock{font-size:12.5vw;letter-spacing:-2px}.date{font-size:2.9vw}.weather-icon{font-size:44px;min-height:44px}.temp{font-size:9vw}#condition{font-size:13px}.bottom{margin-top:16px}.panel{padding:12px;border-radius:17px}.heading{font-size:14px;padding-bottom:8px;margin-bottom:7px}.heading .heading-icon{font-size:18px;margin-right:5px}.forecast{margin-right:8px}.day{font-size:12px}.symbol{font-size:19px;margin:4px 0}.day .low{font-size:11px}.sun-icon{font-size:20px}.sun-name{font-size:12px}.sun-value{font-size:20px}#status{font-size:9px}}
@media(orientation:portrait){.app{padding:24px 16px 15px}.tabs{margin-bottom:26px}.tabs button{font-size:12px;padding:9px 10px}.top{-webkit-align-items:flex-start;align-items:flex-start}.clock{font-size:15vw}.date{font-size:4vw}.weather-icon{font-size:42px}.temp{font-size:12vw}#condition{font-size:12px;white-space:normal}.bottom{-webkit-flex-direction:column;flex-direction:column}.forecast{margin:0 0 12px}.details{margin:0}.heading{font-size:18px}.day{font-size:15px}.sun-name{font-size:15px}.sun-value{font-size:25px}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="nightShade"></div>
<div class="app">
 <div>
  <div class="tabs"><button id="b0" onclick="choose(0)">⌖ Mamer</button><button id="b1" onclick="choose(1)">⌖ La Louvière</button><button id="b2" onclick="choose(2)">⌖ Montréal</button></div>
  <div class="top"><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div><div class="current"><div class="weather-icon" id="weatherIcon">⛅</div><div class="temp" id="temp">--°</div><div id="condition">Chargement...</div><div id="cityname">Mamer</div></div></div>
 </div>
 <div>
  <div class="bottom">
   <div class="panel forecast"><div class="heading"><span class="heading-icon">▣</span> Prévisions sur 5 jours</div><div class="days" id="days"></div></div>
   <div class="panel details"><div class="heading"><span class="heading-icon">☼</span> Soleil &amp; conditions</div><div class="sun-grid" id="sun"><div>Chargement...</div></div><div id="status"></div></div>
  </div>
  <div class="credit" id="credit"></div>
 </div>
</div>
<script>
// Le catalogue de photos de la version précédente est conservé.
// Les photos changent à chaque clic et toutes les 10 minutes.
function photo(file,author){return {url:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width=1280",link:"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(file),author:author}}
var places=[
 {name:"Mamer",lat:49.627,lon:6.024,tz:"Europe/Luxembourg",photos:[
  photo("Mamer, vue générale (101).jpg","Mamer · Wikimedia Commons"),
  photo("Mamer, rue du Marché 2019.jpg","Mamer · Wikimedia Commons"),
  photo("Mamer-Capellen – Paysage rural 2025a.jpg","Mamer · Cayambe / Wikimedia Commons"),
  photo("Kierch Mamer.jpg","Mamer · MMFE / Wikimedia Commons")
 ]},
 {name:"La Louvière",lat:50.478,lon:4.188,tz:"Europe/Brussels",photos:[
  photo("Aerial view of Strépy-Thieu boat lift.jpg","Strépy-Thieu · Union européenne / Wikimedia Commons"),
  photo("Place de la Louve à La Louvière.jpg","La Louvière · Lo-Olivier / Wikimedia Commons"),
  photo("Strépy-Thieu boat lift (DSCF7987).jpg","Strépy-Thieu · Wikimedia Commons"),
  photo("La Louvière - Boulevard Michel Debauque - 2024-05-09.jpg","La Louvière · Le Sharkoïste / Wikimedia Commons")
 ]},
 {name:"Montréal",lat:45.502,lon:-73.567,tz:"America/Toronto",photos:[
  photo("Montreal, Quebec skyline.jpg","Montréal · Quintin Soloviev / Wikimedia Commons"),
  photo("Montréal - Skyline - Nuit.jpg","Montréal · LaurentWillen / Wikimedia Commons"),
  photo("Montreal skyline night.jpg","Montréal · Anirudh Koul / Wikimedia Commons"),
  photo("Montreal skyline by night.jpg","Montréal · Richard Bartz / Wikimedia Commons")
 ]}
];
var selected=0,cityPhotoIndex=[0,0,0],cache=[null,null,null],lastNight=-1,photoTicket=0;
function el(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function cityTimeOptions(){return places[selected].tz}
function cityDate(){var d=new Date(),tz=cityTimeOptions();try{
 el("clock").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
 el("date").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
 }catch(e){el("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());el("date").innerHTML=d.toLocaleDateString("fr-FR")}}
function hour(){try{return parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:cityTimeOptions(),hour:"2-digit",hour12:false}).format(new Date()),10)}catch(e){return new Date().getHours()}}
function night(){var h=hour();return h<7||h>=19}
function background(){
 var n=night(),items=places[selected].photos,city=selected,index=cityPhotoIndex[city]%items.length,ticket=++photoTicket;
 lastNight=n?1:0;
 el("nightShade").style.backgroundColor=n?"rgba(16,11,29,.39)":"rgba(5,12,30,0)";
 function attempt(tries){
  if(ticket!==photoTicket||city!==selected)return;
  var item=items[(index+tries)%items.length];
  el("bg").style.backgroundImage='url("'+item.url+'")';
  el("credit").innerHTML='<a href="'+item.link+'" target="_blank">Photo : '+item.author+'</a>';
  var test=new Image();
  test.onerror=function(){if(ticket===photoTicket&&tries+1<items.length)attempt(tries+1)};
  test.src=item.url;
 }
 attempt(0);cityPhotoIndex[city]++;
}
function symbol(c){if(c===0)return "☀️";if(c<=3)return "⛅";if(c>=51&&c<=67)return "🌧️";if(c>=71&&c<=77)return "❄️";if(c>=80&&c<=82)return "🌦️";if(c>=95)return "⛈️";return "☁️"}
function description(c){if(c===0)return "Ensoleillé";if(c<=3)return "Partiellement nuageux";if(c>=51&&c<=67)return "Pluie";if(c>=71&&c<=77)return "Neige";if(c>=80&&c<=82)return "Averses";if(c>=95)return "Orages";return "Nuageux"}
function choose(n){selected=n;for(var i=0;i<3;i++)el("b"+i).className=i===n?"active":"";el("cityname").innerHTML=places[n].name;el("temp").innerHTML="--°";el("condition").innerHTML="Chargement...";el("weatherIcon").innerHTML="⛅";el("days").innerHTML="";el("sun").innerHTML="Chargement...";cityDate();background();render();if(!cache[n])load(n)}
function render(){var d=cache[selected];if(!d||!d.current||!d.daily)return;var c=d.current,dy=d.daily;
 el("temp").innerHTML=Math.round(c.temperature_2m)+"°C";el("weatherIcon").innerHTML=symbol(c.weather_code);el("condition").innerHTML=description(c.weather_code);
 var h="";for(var i=0;i<5;i++){var date=new Date(dy.time[i]+"T12:00:00");h+='<div class="day">'+date.toLocaleDateString("fr-FR",{weekday:"short"})+'<div class="symbol">'+symbol(dy.weather_code[i])+'</div>'+Math.round(dy.temperature_2m_max[i])+'° / '+Math.round(dy.temperature_2m_min[i])+'°</div>'}
 el("days").innerHTML=h;
 el("sun").innerHTML='<div class="sun-item"><div class="sun-icon">☀</div><div class="sun-name">Lever</div><div class="sun-value">'+dy.sunrise[0].substr(11,5)+'</div></div>'+'<div class="sun-item"><div class="sun-icon">☼</div><div class="sun-name">Coucher</div><div class="sun-value">'+dy.sunset[0].substr(11,5)+'</div></div>'+'<div class="sun-item"><div class="sun-icon">♧</div><div class="sun-name">Ressenti</div><div class="sun-value">'+Math.round(c.apparent_temperature)+'°C</div></div>';
 el("status").innerHTML="Météo actualisée";
}
function load(n){var p=places[n],url="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone="+encodeURIComponent(p.tz),x=new XMLHttpRequest();
 x.open("GET",url,true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){try{cache[n]=JSON.parse(x.responseText);if(n===selected)render()}catch(e){}}else if(n===selected){el("status").innerHTML="Météo temporairement indisponible"}}};x.send()}
function refresh(){for(var i=0;i<3;i++)load(i)}
choose(0);refresh();
setInterval(function(){cityDate();var state=night()?1:0;if(state!==lastNight){background()}},30000);
setInterval(background,600000);
setInterval(refresh,1800000);
</script>
</body>
</html>
