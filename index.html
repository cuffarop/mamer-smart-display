<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mamer Smart Display — Apple style</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:white;background:#192435}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background-color:#263b51;background-position:center center;background-repeat:no-repeat;background-size:cover}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:-webkit-linear-gradient(top,rgba(10,16,27,.28),rgba(7,14,26,.04) 35%,rgba(5,12,23,.70));background:linear-gradient(to bottom,rgba(10,16,27,.28),rgba(7,14,26,.04) 35%,rgba(5,12,23,.70))}
.app{position:relative;z-index:2;min-height:100vh;padding:26px 38px 20px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.tabs{text-align:center;margin:0 auto 24px}
button{font-family:inherit;background:rgba(50,59,79,.42);color:#fff;border:1px solid rgba(255,255,255,.38);border-radius:25px;padding:10px 22px;font-size:16px;margin:3px;cursor:pointer}
button.active{background:rgba(255,255,255,.78);color:#283044;border-color:rgba(255,255,255,.7);text-shadow:none}
.top{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center}
.clock{font-size:112px;font-size:12vw;font-weight:200;letter-spacing:-5px;line-height:1.05}
.date{font-size:25px;font-weight:300;margin:8px 0 0}
.current{text-align:right}.temp{font-size:75px;font-size:9vw;font-weight:200;line-height:1.05}
#condition{font-size:19px}#cityname{font-size:15px;opacity:.85;margin-top:6px}
.bottom{display:-webkit-flex;display:flex;margin-top:26px}
.panel{background:rgba(33,40,53,.54);border:1px solid rgba(255,255,255,.32);border-radius:23px;padding:22px 24px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.forecast{-webkit-flex:1.25;flex:1.25;margin-right:14px}.details{-webkit-flex:1;flex:1}
.heading{font-size:20px;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.3);font-weight:400}
.days{display:-webkit-flex;display:flex;-webkit-justify-content:space-around;justify-content:space-around;text-align:center}
.day{-webkit-flex:1;flex:1;font-size:15px;line-height:1.6;border-right:1px solid rgba(255,255,255,.18)}.day:last-child{border-right:0}
.symbol{font-size:27px;margin:7px 0}.sun{line-height:2;font-size:19px}
#status{font-size:12px;opacity:.65;margin-top:12px}.credit{font-size:10px;text-align:right;margin-top:10px;opacity:.75}.credit a{color:white;text-decoration:underline}
@media(max-width:700px){.app{padding:16px}.tabs{margin-bottom:20px}button{padding:8px 12px;font-size:13px}.clock{letter-spacing:-3px}.date{font-size:17px}.temp{font-size:55px}.panel{padding:12px;border-radius:15px}.heading{font-size:15px}.bottom{margin-top:14px}.day{font-size:12px}.symbol{font-size:20px}.sun{font-size:14px}}
@media(orientation:portrait){.bottom{-webkit-flex-direction:column;flex-direction:column}.forecast{margin-right:0;margin-bottom:12px}.clock{font-size:65px;letter-spacing:-2px}.temp{font-size:52px}.date{font-size:17px}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div class="app">
<div><div class="tabs"><button id="b0" onclick="choose(0)">Mamer</button><button id="b1" onclick="choose(1)">La Louvière</button><button id="b2" onclick="choose(2)">Montréal</button></div>
<div class="top"><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div><div class="current"><div class="temp" id="temp">--°</div><div id="condition">Chargement...</div><div id="cityname">Mamer</div></div></div></div>
<div><div class="bottom"><div class="panel forecast"><div class="heading">Prévisions sur 5 jours</div><div class="days" id="days"></div></div><div class="panel details"><div class="heading">Soleil &amp; conditions</div><div class="sun" id="sun">Chargement...</div><div id="status"></div></div></div><div class="credit" id="credit"></div></div>
</div>
<script>
var places=[{name:"Mamer",lat:49.627,lon:6.024,tz:"Europe/Luxembourg"},{name:"La Louvière",lat:50.478,lon:4.188,tz:"Europe/Brussels"},{name:"Montréal",lat:45.502,lon:-73.567,tz:"America/Toronto"}];
function photo(filename,credit){return {url:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(filename)+"?width=1280",credit:credit,link:"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(filename)}}
var photos=[
{day:[photo("Mamer-Capellen – Paysage rural 2025a.jpg","Mamer · Cayambe / Wikimedia Commons"),photo("Mamer, rue du Marché 2019.jpg","Mamer · Wikimedia Commons")],night:[photo("Mamer-Capellen – Paysage rural 2025a.jpg","Mamer · Cayambe / Wikimedia Commons")]},
{day:[photo("La Louvière - Boulevard Michel Debauque - 2024-05-09.jpg","La Louvière · Le Sharkoïste / Wikimedia Commons"),photo("Place de la Louve à La Louvière.jpg","La Louvière · Lo-Olivier / Wikimedia Commons")],night:[photo("La Louvière - Boulevard Michel Debauque - 2024-05-09.jpg","La Louvière · Le Sharkoïste / Wikimedia Commons")]},
{day:[photo("Montreal Skyline.jpg","Montréal · CanadianPhotographer / Wikimedia Commons"),photo("Skyline of Montreal.jpg","Montréal · Marc-Olivier Jodoin / Wikimedia Commons")],night:[photo("Montreal skyline night.jpg","Montréal · Anirudh Koul / Wikimedia Commons"),photo("Montréal - Skyline - Nuit.jpg","Montréal · LaurentWillen / Wikimedia Commons")]}
];
var selected=0,photoIndex=0,cache=[null,null,null],lastDayState=-1;
function el(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:n}
function cityDate(){var d=new Date(),p=places[selected];try{el("clock").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:p.tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);el("date").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:p.tz,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d)}catch(e){el("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());el("date").innerHTML=d.toLocaleDateString("fr-FR")}}
function hour(){try{return parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:places[selected].tz,hour:"2-digit",hour12:false}).format(new Date()),10)}catch(e){return new Date().getHours()}}
function background(){var h=hour(),isDay=(h>=7&&h<19),arr=isDay?photos[selected].day:photos[selected].night,item=arr[photoIndex%arr.length];el("bg").style.backgroundImage='url("'+item.url+'")';el("shade").style.backgroundColor=isDay?"transparent":"rgba(2,6,16,.30)";el("credit").innerHTML='<a href="'+item.link+'" target="_blank">Photo : '+item.credit+'</a>';lastDayState=isDay?1:0;photoIndex++}
function symbol(c){if(c===0)return "☀️";if(c<=3)return "⛅";if(c>=51&&c<=67)return "🌧️";if(c>=71&&c<=77)return "❄️";if(c>=80&&c<=82)return "🌦️";if(c>=95)return "⛈️";return "☁️"}
function description(c){if(c===0)return "Ensoleillé";if(c<=3)return "Partiellement nuageux";if(c>=51&&c<=67)return "Pluie";if(c>=71&&c<=77)return "Neige";if(c>=80&&c<=82)return "Averses";if(c>=95)return "Orages";return "Nuageux"}
function choose(n){selected=n;photoIndex=0;for(var i=0;i<3;i++)el("b"+i).className=i===n?"active":"";el("cityname").innerHTML=places[n].name;el("temp").innerHTML="--°";el("condition").innerHTML="Chargement...";cityDate();background();render();if(!cache[n])load(n)}
function render(){var d=cache[selected];if(!d)return;var c=d.current,dy=d.daily;el("temp").innerHTML=Math.round(c.temperature_2m)+"°C";el("condition").innerHTML=symbol(c.weather_code)+" "+description(c.weather_code);var h="";for(var i=0;i<5;i++){var day=new Date(dy.time[i]+"T12:00:00");h+='<div class="day">'+day.toLocaleDateString("fr-FR",{weekday:"short"})+'<div class="symbol">'+symbol(dy.weather_code[i])+'</div>'+Math.round(dy.temperature_2m_max[i])+'°<div>'+Math.round(dy.temperature_2m_min[i])+'°</div></div>'}el("days").innerHTML=h;el("sun").innerHTML="☀ Lever : "+dy.sunrise[0].substr(11,5)+"<br>☾ Coucher : "+dy.sunset[0].substr(11,5)+"<br>Ressenti : "+Math.round(c.apparent_temperature)+"°C";el("status").innerHTML="Météo actualisée"}
function load(n){var p=places[n],url="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone="+encodeURIComponent(p.tz),x=new XMLHttpRequest();x.open("GET",url,true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){try{cache[n]=JSON.parse(x.responseText);if(n===selected)render()}catch(e){}}else if(n===selected){el("status").innerHTML="Météo temporairement indisponible"}}};x.send()}
function refresh(){for(var i=0;i<3;i++)load(i)}
choose(0);refresh();setInterval(function(){cityDate();var state=(hour()>=7&&hour()<19)?1:0;if(state!==lastDayState){photoIndex=0;background()}},30000);setInterval(background,600000);setInterval(refresh,1800000);
</script>
</body>
</html>
