
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mamer Smart Display V4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:white;background:#14283a}
#bg{position:fixed;inset:0;background:#14283a center/cover no-repeat;z-index:0}
#shade{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.08) 45%,rgba(0,0,0,.75));z-index:1}
.app{position:relative;z-index:2;min-height:100vh;padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between}
.clock{font-size:90px;font-weight:200}
.date{font-size:20px}
.current{text-align:right}
.temp{font-size:65px}
.tabs{text-align:center;margin:15px}
button{background:rgba(0,0,0,.4);color:white;border:1px solid white;border-radius:25px;padding:10px 18px;font-size:17px;margin:4px}
button.active{background:rgba(255,255,255,.35)}
.bottom{display:flex;gap:12px}
.panel{background:rgba(10,25,40,.65);border:1px solid rgba(255,255,255,.3);border-radius:15px;padding:15px}
.forecast{flex:2}
.details{flex:1}
.days{display:flex;justify-content:space-around;text-align:center}
.day{flex:1}
.symbol{font-size:28px;margin:8px}
.heading{margin-bottom:15px}
.sun{line-height:2}
@media(orientation:portrait){.bottom{flex-direction:column}.clock{font-size:65px}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>
<div class="app">
<div>
<div class="top">
<div>
<div class="clock" id="clock">--:--</div>
<div class="date" id="date"></div>
</div>
<div class="current">
<div class="temp" id="temp">--°</div>
<div id="condition">Chargement...</div>
<div id="cityname">Mamer</div>
</div>
</div>
<div class="tabs">
<button id="b0" onclick="choose(0)">Mamer</button>
<button id="b1" onclick="choose(1)">La Louvière</button>
<button id="b2" onclick="choose(2)">Montréal</button>
</div>
</div>
<div class="bottom">
<div class="panel forecast">
<div class="heading">Prévisions sur 5 jours</div>
<div class="days" id="days"></div>
</div>
<div class="panel details">
<div class="heading">Soleil & conditions</div>
<div class="sun" id="sun">Chargement...</div>
<div id="status"></div>
</div>
</div>
</div>
<script>
var places=[
{name:"Mamer",lat:49.627,lon:6.024,tz:"Europe/Luxembourg"},
{name:"La Louvière",lat:50.478,lon:4.188,tz:"Europe/Brussels"},
{name:"Montréal",lat:45.502,lon:-73.567,tz:"America/Toronto"}
];
var photos={
day:[
"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1400",
"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1400"
],
night:[
"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400",
"https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?w=1400"
]
};
var selected=0,photoIndex=0,cache=[null,null,null];
function el(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:n}
function cityDate(){
var d=new Date(),p=places[selected];
try{
var f=new Intl.DateTimeFormat("fr-FR",{timeZone:p.tz,hour:"2-digit",minute:"2-digit",hour12:false});
el("clock").innerHTML=f.format(d);
el("date").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:p.tz,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
}catch(e){
el("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());
el("date").innerHTML=d.toLocaleDateString("fr-FR");
}
}
function hour(){
try{
return parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:places[selected].tz,hour:"2-digit",hour12:false}).format(new Date()),10);
}catch(e){return new Date().getHours()}
}
function background(){
var h=hour(),arr=(h>=7&&h<19)?photos.day:photos.night;
var url=arr[photoIndex%arr.length];
var img=new Image();
img.onload=function(){el("bg").style.backgroundImage='url("'+url+'")'};
img.src=url;
photoIndex++;
}
function symbol(c){
if(c===0)return "☀️";
if(c<=3)return "⛅";
if(c>=51&&c<=67)return "🌧️";
if(c>=71&&c<=77)return "❄️";
if(c>=80&&c<=82)return "🌦️";
if(c>=95)return "⛈️";
return "☁️";
}
function choose(n){
selected=n;photoIndex=0;
for(var i=0;i<3;i++)el("b"+i).className=i===n?"active":"";
el("cityname").innerHTML=places[n].name;
cityDate();background();render();
}
function render(){
var d=cache[selected];
if(!d)return;
var c=d.current,dy=d.daily;
el("temp").innerHTML=Math.round(c.temperature_2m)+"°";
el("condition").innerHTML=symbol(c.weather_code);
var h="";
for(var i=0;i<5;i++){
var day=new Date(dy.time[i]+"T12:00:00");
h+='<div class="day">'+day.toLocaleDateString("fr-FR",{weekday:"short"})+'<div class="symbol">'+symbol(dy.weather_code[i])+'</div>'+Math.round(dy.temperature_2m_max[i])+'°<div>'+Math.round(dy.temperature_2m_min[i])+'°</div></div>';
}
el("days").innerHTML=h;
el("sun").innerHTML="☀ Lever : "+dy.sunrise[0].substr(11,5)+"<br>☾ Coucher : "+dy.sunset[0].substr(11,5)+"<br>Ressenti : "+Math.round(c.apparent_temperature)+"°";
el("status").innerHTML="Météo actualisée";
}
function load(n){
var p=places[n];
var url="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone="+encodeURIComponent(p.tz);
var x=new XMLHttpRequest();
x.open("GET",url,true);
x.onreadystatechange=function(){
if(x.readyState===4&&x.status===200){
try{cache[n]=JSON.parse(x.responseText);if(n===selected)render()}catch(e){}
}
};
x.send();
}
function refresh(){for(var i=0;i<3;i++)load(i)}
choose(0);refresh();
setInterval(cityDate,1000);
setInterval(background,600000);
setInterval(refresh,1800000);
</script>
</body>
</html>
