<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mamer Smart Display — photos des villes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#1d2c3b}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:#1d2c3b center center no-repeat;background-size:cover;z-index:0}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:-webkit-linear-gradient(top,rgba(4,12,25,.28),rgba(5,12,22,.08) 36%,rgba(5,10,20,.67));background:linear-gradient(to bottom,rgba(4,12,25,.28),rgba(5,12,22,.08) 36%,rgba(5,10,20,.67))}
#nightShade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;background:rgba(5,12,30,0)}
.app{position:relative;z-index:2;min-height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;padding:22px 32px 12px;text-shadow:0 1px 7px rgba(0,0,0,.26)}
.tabs{text-align:center;margin:0 auto 22px}
button{font-family:inherit;background:rgba(45,54,73,.5);color:white;border:1px solid rgba(255,255,255,.65);border-radius:30px;padding:9px 20px;margin:3px;font-size:16px;cursor:pointer}
button.active{background:rgba(255,255,255,.84);color:#26364b;border-color:white;text-shadow:none}
.top{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center}
.clock{font-size:110px;font-size:11vw;line-height:1.08;font-weight:200;letter-spacing:-4px}.date{font-size:23px;margin-top:4px}
.current{text-align:right}.temp{font-size:78px;font-size:8vw;line-height:1.15;font-weight:200}#condition{font-size:19px}#cityname{font-size:14px;opacity:.88;margin-top:5px}
.bottom{display:-webkit-flex;display:flex;margin-top:24px}.panel{border-radius:22px;padding:18px 20px;border:1px solid rgba(255,255,255,.35);background:rgba(28,38,51,.57)}
.forecast{-webkit-flex:1.3;flex:1.3;margin-right:12px}.details{-webkit-flex:1;flex:1}
.heading{font-size:19px;font-weight:normal;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.32)}
.days{display:-webkit-flex;display:flex;text-align:center}.day{-webkit-flex:1;flex:1;line-height:1.55;font-size:15px;border-right:1px solid rgba(255,255,255,.23)}.day:last-child{border:0}.symbol{font-size:26px;margin:6px 0}.sun{line-height:1.9;font-size:18px}
#status{font-size:11px;opacity:.75;margin-top:12px}.credit{text-align:right;margin-top:8px;font-size:11px}.credit a{color:white;text-decoration:underline}
@media(max-width:720px){.app{padding:12px}.tabs{margin-bottom:12px}button{font-size:12px;padding:7px 10px;margin:2px}.clock{font-size:15vw;letter-spacing:-2px}.date{font-size:15px}.temp{font-size:10vw}#condition{font-size:14px}.bottom{margin-top:12px}.panel{padding:10px;border-radius:14px}.heading{font-size:14px}.day{font-size:12px}.symbol{font-size:19px}.sun{font-size:13px}}
@media(orientation:portrait){.bottom{-webkit-flex-direction:column;flex-direction:column}.forecast{margin-right:0;margin-bottom:10px}.clock{font-size:16vw}.temp{font-size:13vw}.date{font-size:16px}.top{-webkit-align-items:flex-start;align-items:flex-start}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="nightShade"></div>
<div class="app">
  <div>
    <div class="tabs">
      <button id="b0" onclick="choose(0)">Mamer</button>
      <button id="b1" onclick="choose(1)">La Louvière</button>
      <button id="b2" onclick="choose(2)">Montréal</button>
    </div>
    <div class="top">
      <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
      <div class="current"><div class="temp" id="temp">--°</div><div id="condition">Chargement...</div><div id="cityname">Mamer</div></div>
    </div>
  </div>
  <div>
    <div class="bottom">
      <div class="panel forecast"><div class="heading">Prévisions sur 5 jours</div><div class="days" id="days"></div></div>
      <div class="panel details"><div class="heading">Soleil &amp; conditions</div><div class="sun" id="sun">Chargement...</div><div id="status"></div></div>
    </div>
    <div class="credit" id="credit"></div>
  </div>
</div>
<script>
// Photos nommées et attribuées. Sources : Wikimedia Commons (photos de lieux réels).
// Chaque clic fait avancer les photos de la ville. La nuit, les images sont assombries.
function photo(file,author){return {url:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width=1280",link:"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(file),author:author}}
var places=[
 {name:"Mamer",lat:49.627,lon:6.024,tz:"Europe/Luxembourg",photos:[
  photo("Mamer, vue générale (101).jpg","Mamer · Wikimedia Commons"),
  photo("Mamer, rue du Marché 2019.jpg","Mamer · Wikimedia Commons"),
  photo("Mamer-Capellen – Paysage rural 2025a.jpg","Mamer · Cayambe / Wikimedia Commons"),
  photo("Kierch Mamer.jpg","Mamer · MMFE / Wikimedia Commons")
 ]},
 {name:"La Louvière",lat:50.478,lon:4.188,tz:"Europe/Brussels",photos:[
  photo("Aerial view of Strépy-Thieu boat lift.jpg","Strépy-Thieu · Union européenne / Wikimedia Commons"),
  photo("Place de la Louve à La Louvière.jpg","La Louvière · Lo-Olivier / Wikimedia Commons"),
  photo("Strépy-Thieu boat lift (DSCF7987).jpg","Strépy-Thieu · Wikimedia Commons"),
  photo("La Louvière - Boulevard Michel Debauque - 2024-05-09.jpg","La Louvière · Le Sharkoïste / Wikimedia Commons")
 ]},
 {name:"Montréal",lat:45.502,lon:-73.567,tz:"America/Toronto",photos:[
  photo("Montreal, Quebec skyline.jpg","Montréal · Quintin Soloviev / Wikimedia Commons"),
  photo("Montréal - Skyline - Nuit.jpg","Montréal · LaurentWillen / Wikimedia Commons"),
  photo("Montreal skyline night.jpg","Montréal · Anirudh Koul / Wikimedia Commons"),
  photo("Montreal skyline by night.jpg","Montréal · Richard Bartz / Wikimedia Commons")
 ]}
];
var selected=0,photoIndex=0,cityPhotoIndex=[0,0,0],cache=[null,null,null],lastNight=-1,photoTicket=0;
function el(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function cityTimeOptions(){return places[selected].tz}
function cityDate(){var d=new Date(),tz=cityTimeOptions();try{
 el("clock").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
 el("date").innerHTML=new Intl.DateTimeFormat("fr-FR",{timeZone:tz,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
 }catch(e){el("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());el("date").innerHTML=d.toLocaleDateString("fr-FR")}}
function hour(){try{return parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:cityTimeOptions(),hour:"2-digit",hour12:false}).format(new Date()),10)}catch(e){return new Date().getHours()}}
function night(){var h=hour();return h<7||h>=19}
function background(){
 var n=night(),items=places[selected].photos,city=selected,index=cityPhotoIndex[city]%items.length,ticket=++photoTicket;
 lastNight=n?1:0;
 el("nightShade").style.backgroundColor=n?"rgba(5,12,30,.44)":"rgba(5,12,30,0)";
 // Sur un ancien Safari : affectation CSS directe, sans dépendre de l'événement onload.
 function attempt(tries){
  if(ticket!==photoTicket||city!==selected)return;
  var item=items[(index+tries)%items.length];
  el("bg").style.backgroundImage='url("'+item.url+'")';
  el("credit").innerHTML='<a href="'+item.link+'" target="_blank">Photo : '+item.author+'</a>';
  var test=new Image();
  test.onerror=function(){if(ticket===photoTicket&&tries+1<items.length)attempt(tries+1)};
  test.src=item.url;
 }
 attempt(0);cityPhotoIndex[city]++;
}
function symbol(c){if(c===0)return "☀️";if(c<=3)return "⛅";if(c>=51&&c<=67)return "🌧️";if(c>=71&&c<=77)return "❄️";if(c>=80&&c<=82)return "🌦️";if(c>=95)return "⛈️";return "☁️"}
function description(c){if(c===0)return "Ensoleillé";if(c<=3)return "Partiellement nuageux";if(c>=51&&c<=67)return "Pluie";if(c>=71&&c<=77)return "Neige";if(c>=80&&c<=82)return "Averses";if(c>=95)return "Orages";return "Nuageux"}
function choose(n){selected=n;for(var i=0;i<3;i++)el("b"+i).className=i===n?"active":"";el("cityname").innerHTML=places[n].name;el("temp").innerHTML="--°";el("condition").innerHTML="Chargement...";el("days").innerHTML="";el("sun").innerHTML="Chargement...";cityDate();background();render();if(!cache[n])load(n)}
function render(){var d=cache[selected];if(!d||!d.current||!d.daily)return;var c=d.current,dy=d.daily;
 el("temp").innerHTML=Math.round(c.temperature_2m)+"°";el("condition").innerHTML=symbol(c.weather_code)+" "+description(c.weather_code);
 var h="";for(var i=0;i<5;i++){var date=new Date(dy.time[i]+"T12:00:00");h+='<div class="day">'+date.toLocaleDateString("fr-FR",{weekday:"short"})+'<div class="symbol">'+symbol(dy.weather_code[i])+'</div>'+Math.round(dy.temperature_2m_max[i])+'°<div>'+Math.round(dy.temperature_2m_min[i])+'°</div></div>'}
 el("days").innerHTML=h;el("sun").innerHTML="☀ Lever : "+dy.sunrise[0].substr(11,5)+"<br>☾ Coucher : "+dy.sunset[0].substr(11,5)+"<br>Ressenti : "+Math.round(c.apparent_temperature)+"°";el("status").innerHTML="Météo actualisée";
}
function load(n){var p=places[n],url="https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=5&timezone="+encodeURIComponent(p.tz),x=new XMLHttpRequest();
 x.open("GET",url,true);x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200){try{cache[n]=JSON.parse(x.responseText);if(n===selected)render()}catch(e){}}else if(n===selected){el("status").innerHTML="Météo temporairement indisponible"}}};x.send()}
function refresh(){for(var i=0;i<3;i++)load(i)}
choose(0);refresh();
setInterval(function(){cityDate();var state=night()?1:0;if(state!==lastNight){background()}},30000);
setInterval(background,600000);
setInterval(refresh,1800000);
</script>
</body>
</html>
